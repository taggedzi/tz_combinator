[package]
name = "combinator-app"
version = "0.2.1"
edition = "2021"
rust-version = "1.94.1"
license = "MIT"
description = "Interface-neutral application workflows for tz_combinator"
readme = "../../README.md"
repository = "https://github.com/taggedzi/tz_combinator"

[dependencies]
combinator-core = { version = "0.2.1", path = "../combinator-core" }
combinator-codecs = { version = "0.2.1", path = "../combinator-codecs" }
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }
csv = "1"
serde_json = "1"
