[package]
name = "combinator-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"

[[bin]]
name = "combinator"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
combinator-core = { path = "../combinator-core" }
