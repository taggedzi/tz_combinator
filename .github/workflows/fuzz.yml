name: Fuzz smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 6"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.94.1

      - name: Restore fuzz build and tool cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: cargo-fuzz-${{ runner.os }}-rust-1.94.1-tool-0.12.0-${{ hashFiles('fuzz/Cargo.lock') }}
          workspaces: "fuzz -> target"

      - name: Install pinned cargo-fuzz
        shell: bash
        run: |
          set -euo pipefail
          if ! cargo fuzz --version 2>/dev/null | grep -Fq "0.12.0"; then
            cargo install cargo-fuzz --version 0.12.0 --locked
          fi
          cargo fuzz --version | grep -Fq "0.12.0"

      - name: Run bounded smoke campaign
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for target in inline template join_jsonl output; do
            if ! cargo fuzz run --manifest-path fuzz/Cargo.toml "$target" -- -max_total_time=15 -rss_limit_mb=256; then
              status=1
            fi
          done
          exit "$status"
