name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        type: string

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.94.1
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$env:RUST_TOOLCHAIN" --profile minimal
        if: runner.os == 'Windows'

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
        if: runner.os == 'Linux'

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-package-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          cache-bin: "false"

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Build release binaries
        run: cargo build --workspace --release --locked

      - name: Smoke test Linux release binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          target/release/combinator --version
          actual="$(target/release/combinator --list 'red,blue' --list 'car,bike' --sep '-')"
          expected=$'red-car\nred-bike\nblue-car\nblue-bike'
          [[ "$actual" == "$expected" ]]
          target/release/combinator --list 'a,b' --list '1,2' --format jsonl | grep -q '"i":0'

      - name: Smoke test Windows release binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & target/release/combinator.exe --version
          $actual = @(& target/release/combinator.exe --list 'red,blue' --list 'car,bike' --sep '-')
          $expected = @('red-car', 'red-bike', 'blue-car', 'blue-bike')
          if (Compare-Object -ReferenceObject $expected -DifferenceObject $actual) { throw 'Unexpected smoke output' }

      - name: Package Linux binaries
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          root="tz-combinator-${version}-${{ matrix.platform }}"
          mkdir -p "$root"
          cp target/release/combinator target/release/combinator-gui target/release/combinator-tui "$root/"
          cp LICENSE README.md CHANGELOG.md THIRD_PARTY_LICENSES.md "$root/"
          tar -czf "${root}.tar.gz" "$root"
          sha256sum "${root}.tar.gz" > "${root}.tar.gz.sha256"

      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $root = "tz-combinator-$version-${{ matrix.platform }}"
          New-Item -ItemType Directory -Path $root | Out-Null
          Copy-Item target/release/combinator.exe, target/release/combinator-gui.exe, target/release/combinator-tui.exe $root
          Copy-Item LICENSE, README.md, CHANGELOG.md, THIRD_PARTY_LICENSES.md $root
          Compress-Archive -Path $root -DestinationPath "$root.zip"
          $hash = (Get-FileHash "$root.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $root.zip" | Set-Content "$root.zip.sha256"

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.platform }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish release artifacts
    needs: [package, coverage, install, dependencies]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Verify checksums
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$RELEASE_TAG" == v* ]]
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$tag_commit" = "$(git rev-parse HEAD)"
          scripts/verify-release.sh "$version"
          find artifacts -name '*.sha256' -print0 | while IFS= read -r -d '' checksum; do
            (cd "$(dirname "$checksum")" && sha256sum --check "$(basename "$checksum")")
          done
          linux_archive="$(find artifacts -type f -name '*-linux-x86_64.tar.gz' -print -quit)"
          windows_archive="$(find artifacts -type f -name '*-windows-x86_64.zip' -print -quit)"
          test -n "$linux_archive" -a -n "$windows_archive"
          linux_root="tz-combinator-${version}-linux-x86_64"
          windows_root="tz-combinator-${version}-windows-x86_64"
          linux_listing="$(tar -tzf "$linux_archive")"
          windows_listing="$(unzip -Z1 "$windows_archive")"
          for file in combinator combinator-gui combinator-tui LICENSE README.md CHANGELOG.md THIRD_PARTY_LICENSES.md; do
            grep -Fxq "$linux_root/$file" <<<"$linux_listing"
          done
          for file in combinator.exe combinator-gui.exe combinator-tui.exe LICENSE README.md CHANGELOG.md THIRD_PARTY_LICENSES.md; do
            grep -Fxq "$windows_root/$file" <<<"$windows_listing"
          done

      - name: Generate build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          create-storage-record: false
          subject-path: |
            ${{ github.workspace }}/artifacts/**/*.tar.gz
            ${{ github.workspace }}/artifacts/**/*.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f \( -name '*.tar.gz' -o -name '*.tar.gz.sha256' -o -name '*.zip' -o -name '*.zip.sha256' \) -print)
          gh release create "$RELEASE_TAG" "${files[@]}" --verify-tag --generate-notes

  coverage:
    name: Coverage threshold
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal

      - name: Restore coverage build and tool cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: cargo-llvm-cov-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-tool-0.8.7-${{ hashFiles('Cargo.lock') }}

      - name: Install pinned coverage tool
        shell: bash
        run: |
          set -euo pipefail
          if ! cargo llvm-cov --version 2>/dev/null | grep -Fq "0.8.7"; then
            cargo install cargo-llvm-cov --version 0.8.7 --locked
          fi
          cargo llvm-cov --version | grep -Fq "0.8.7"

      - name: Enforce line coverage
        run: cargo llvm-cov --workspace --all-features --exclude combinator-gui --exclude combinator-tui --summary-only --fail-under-lines 80

  install:
    name: Package and install validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-install-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          cache-bin: "false"

      - name: Package workspace crates
        run: cargo package --workspace --locked --no-verify
      - name: Validate cargo install
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/combinator-install"
          cargo install --path crates/combinator-cli --locked --root "$install_root"
          "$install_root/bin/combinator" --version
          actual="$("$install_root/bin/combinator" --list 'red,blue' --list 'car,bike' --sep '-')"
          expected=$'red-car\nred-bike\nblue-car\nblue-bike'
          [[ "$actual" == "$expected" ]]

  dependencies:
    name: Dependency review
    uses: ./.github/workflows/dependency-review.yml
