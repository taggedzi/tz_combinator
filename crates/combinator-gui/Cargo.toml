[package]
name = "combinator-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
license = "MIT"
description = "Desktop GUI for tz_combinator"
readme = "../../README.md"
repository = "https://github.com/taggedzi/tz_combinator"

[[bin]]
name = "combinator-gui"
path = "src/main.rs"

[dependencies]
combinator-app = { version = "0.1.0", path = "../combinator-app" }
iced = { version = "0.14", features = ["tokio"] }
rfd = "0.15"
