name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version without the v prefix (for example, 0.2.0)
        required: true
        type: string
      release_date:
        description: Release date in YYYY-MM-DD (defaults to the current UTC date)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.94.1
  GIT_CLIFF_VERSION: 2.12.0
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Generate release preparation PR
    runs-on: ubuntu-24.04
    steps:
      - name: Check out default branch with release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate workflow inputs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_DATE: ${{ inputs.release_date }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]]
          if [[ -n "$RELEASE_DATE" ]]; then
            [[ "$RELEASE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
            test "$(date -u -d "$RELEASE_DATE" +%F)" = "$RELEASE_DATE"
          fi
          git rev-parse --verify --quiet "refs/tags/v$VERSION" && {
            echo "Tag v$VERSION already exists." >&2
            exit 1
          }
          branch="release/v$VERSION"
          branch_matches="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$branch" \
              --jq 'length'
          )"
          test "$branch_matches" = 0 || {
            echo "Remote branch $branch already exists." >&2
            exit 1
          }

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Restore Rust build and changelog-tool cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: git-cliff-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-tool-${{ env.GIT_CLIFF_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Install pinned changelog generator
        shell: bash
        run: |
          set -euo pipefail
          if ! git-cliff --version 2>/dev/null | grep -Fq "$GIT_CLIFF_VERSION"; then
            cargo +"$RUST_TOOLCHAIN" install git-cliff --version "$GIT_CLIFF_VERSION" --locked
          fi
          test "$(git-cliff --version)" = "git-cliff $GIT_CLIFF_VERSION"

      - name: Generate changelog and synchronize versions
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_DATE: ${{ inputs.release_date }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_DATE" ]]; then
            scripts/prepare-release.sh "$VERSION" "$RELEASE_DATE"
          else
            scripts/prepare-release.sh "$VERSION"
          fi

      - name: Check generated scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_files < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )
          test "${#changed_files[@]}" -gt 0
          for file in "${changed_files[@]}"; do
            case "$file" in
              CHANGELOG.md|Cargo.lock|crates/*/Cargo.toml|release-notes/*.md)
                ;;
              *)
                echo "Release preparation unexpectedly changed $file." >&2
                exit 1
                ;;
            esac
          done
          git diff --check

      - name: Verify generated workspace
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/verify-release.sh "$VERSION"
          cargo +"$RUST_TOOLCHAIN" test --workspace --locked
          cargo +"$RUST_TOOLCHAIN" fmt --all -- --check
          cargo +"$RUST_TOOLCHAIN" clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Commit release preparation
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          branch="release/v$VERSION"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md Cargo.lock crates/*/Cargo.toml release-notes/"$VERSION.md"
          git commit -m "chore(release): prepare v$VERSION"
          gh auth setup-git
          git push --set-upstream origin "$branch"

      - name: Open release preparation PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          branch="release/v$VERSION"
          body="$(printf '%s\n\n%s\n\n%s\n' \
            "Automated release preparation for **v$VERSION**." \
            "This synchronizes workspace versions and generates the committed changelog from conventional commits. Review \`release-notes/$VERSION.md\`; edit it if necessary and run \`scripts/sync-release-notes.sh $VERSION\` before merging." \
            "Generation and the full Rust verification suite passed in [the preparation run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). After merging, tag the merge commit by following \`docs/release.md\`.")"
          gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "$branch" \
            --title "chore(release): prepare v$VERSION" \
            --body "$body"
