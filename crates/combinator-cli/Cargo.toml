[package]
name = "combinator-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"

[[bin]]
name = "combinator"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
csv = "1.4"
serde_json = "1"
fs2 = "0.4"
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }
combinator-core = { path = "../combinator-core" }
