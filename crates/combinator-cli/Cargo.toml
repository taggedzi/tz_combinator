[package]
name = "combinator-cli"
version = "0.2.2"
edition = "2021"
rust-version = "1.94.1"
license = "MIT"
description = "Combine text lists into ordered combinations from the command line"
readme = "../../README.md"
repository = "https://github.com/taggedzi/tz_combinator"

[[bin]]
name = "combinator"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
csv = "1.4"
serde_json = "1"
tracing = "0.1"
fs2 = "0.4"
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }
combinator-core = { version = "0.2.2", path = "../combinator-core" }
combinator-codecs = { version = "0.2.2", path = "../combinator-codecs" }
combinator-app = { version = "0.2.2", path = "../combinator-app" }
