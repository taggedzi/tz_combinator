[advisories]
version = 2
ignore = [
    "RUSTSEC-2024-0436", # paste is a transitive Apple/Metal build dependency.
    "RUSTSEC-2026-0192", # ttf-parser is a transitive iced font dependency.
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSL-1.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
