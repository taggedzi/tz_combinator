# Changelog generation for release preparation.
# Keep this configuration deterministic: release dates are added by
# scripts/release.py, and external commands are disabled there.

[changelog]
header = ""
body = """
## [{{ version | trim_start_matches(pat="v") }}]
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | split(pat=" -->") | last }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
    { message = "^[a-z]+(\\([^)]*\\))?!:", group = "<!-- 0 -->Breaking Changes" },
    { message = "^security", group = "<!-- 1 -->Security" },
    { message = "^feat", group = "<!-- 2 -->Added" },
    { message = "^fix", group = "<!-- 3 -->Fixed" },
    { message = "^perf|^revert", group = "<!-- 4 -->Changed" },
    { message = "^docs|^test|^ci|^build|^style|^refactor|^chore", skip = true },
    { message = "^Merge ", skip = true },
    { message = ".*", skip = true },
]
filter_commits = true
fail_on_unmatched_commit = false
tag_pattern = "^v(0|[1-9][0-9]{0,8})\\.(0|[1-9][0-9]{0,8})\\.(0|[1-9][0-9]{0,8})$"
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
recurse_submodules = false
