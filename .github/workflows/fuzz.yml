name: Fuzz smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 6"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [inline, template, join_jsonl, output]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@fb51252c7ba57d633bc668f941da421e61e8f2c1 # v1
        with:
          toolchain: 1.94.1
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.12.0 --locked
      - name: Run bounded smoke campaign
        run: cargo fuzz run --manifest-path fuzz/Cargo.toml ${{ matrix.target }} -- -max_total_time=15 -rss_limit_mb=256
